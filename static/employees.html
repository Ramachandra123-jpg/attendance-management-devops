<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Employees · Employee Management System</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app-shell">
    <aside class="sidebar">
        <div class="brand"><span class="logo-dot"></span><span class="brand-text">EMS</span></div>
        <nav>
            <a href="dashboard.html"><span>🏠</span><span class="link-text">Dashboard</span></a>
            <a href="employees.html" class="active"><span>👤</span><span class="link-text">Employees</span></a>
            <a href="attendance.html"><span>🗓️</span><span class="link-text">Attendance</span></a>
            <a href="reports.html"><span>📊</span><span class="link-text">Reports</span></a>
        </nav>
        <div class="sidebar-footer">
            <div class="user-chip"><strong id="sidebarUserName">-</strong><span id="sidebarUserRole"></span></div>
            <button class="logout-btn" onclick="logout()"><span>Log out</span></button>
        </div>
    </aside>

    <main class="main">
        <div class="page-header">
            <div>
                <h1>Employees</h1>
                <p>Add, edit, and manage employee records.</p>
            </div>
            <button class="btn btn-primary" id="addEmployeeBtn">+ Add Employee</button>
        </div>

        <div class="toolbar">
            <input type="text" id="searchInput" placeholder="Search name, code, or email...">
            <select id="departmentFilter">
                <option value="">All Departments</option>
            </select>
            <select id="statusFilter">
                <option value="">All Statuses</option>
                <option value="ACTIVE">Active</option>
                <option value="INACTIVE">Inactive</option>
            </select>
            <div class="spacer"></div>
            <span id="resultCount" style="font-size:13px; color:#6b7688;"></span>
        </div>

        <div id="tableWrap">
            <table>
                <thead>
                    <tr>
                        <th>Code</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Department</th>
                        <th>Designation</th>
                        <th>Joined</th>
                        <th>Status</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="employeeTableBody">
                </tbody>
            </table>
            <div class="empty-state" id="emptyState" style="display:none;">No employees found.</div>
        </div>
    </main>
</div>

<!-- Add / Edit Employee Modal -->
<div class="modal-overlay" id="employeeModal">
    <div class="modal">
        <h2 id="modalTitle">Add Employee</h2>
        <form id="employeeForm">
            <input type="hidden" id="employeeId">
            <div class="form-grid">
                <div class="field">
                    <label for="employeeCode">Employee Code *</label>
                    <input type="text" id="employeeCode" required placeholder="EMP004">
                </div>
                <div class="field">
                    <label for="status">Status</label>
                    <select id="status">
                        <option value="ACTIVE">Active</option>
                        <option value="INACTIVE">Inactive</option>
                    </select>
                </div>
                <div class="field">
                    <label for="firstName">First Name *</label>
                    <input type="text" id="firstName" required>
                </div>
                <div class="field">
                    <label for="lastName">Last Name *</label>
                    <input type="text" id="lastName" required>
                </div>
                <div class="field">
                    <label for="email">Email *</label>
                    <input type="email" id="email" required>
                </div>
                <div class="field">
                    <label for="phone">Phone</label>
                    <input type="text" id="phone">
                </div>
                <div class="field">
                    <label for="department">Department</label>
                    <input type="text" id="department" list="departmentList" placeholder="Engineering">
                    <datalist id="departmentList"></datalist>
                </div>
                <div class="field">
                    <label for="designation">Designation</label>
                    <input type="text" id="designation" placeholder="Software Engineer">
                </div>
                <div class="field">
                    <label for="dateOfJoining">Date of Joining</label>
                    <input type="date" id="dateOfJoining">
                </div>
                <div class="field">
                    <label for="salary">Salary</label>
                    <input type="number" id="salary" min="0" step="0.01">
                </div>
                <div class="field full">
                    <label for="address">Address</label>
                    <textarea id="address" rows="2"></textarea>
                </div>
            </div>
            <div class="modal-actions">
                <button type="button" class="btn btn-secondary" id="cancelBtn">Cancel</button>
                <button type="submit" class="btn btn-primary" id="saveEmployeeBtn">Save Employee</button>
            </div>
        </form>
    </div>
</div>

<div id="toast"></div>

<script src="js/api.js"></script>
<script src="js/employees.js"></script>
</body>
</html>
